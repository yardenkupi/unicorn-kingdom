<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="משחק לימודי במגע לגילאי 3-4: ספירה, מספרים, כמויות, צבעים, צורות, זיכרון וצביעה.">
<meta name="theme-color" content="#7cc8ff">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>ממלכת חד הקרן</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen touch app. A sky-and-meadow stage, a top bar of round toy
   buttons, a speech-bubble prompt, and a play field of oversized targets.
   One bright storybook world by choice, so there is no dark variant. */
:root{
  --sky-top:#7cc8ff; --sky-low:#ffe1ef; --meadow:#8be28f; --meadow-deep:#4fbf6b;
  --ink:#43245f; --ink-soft:#7a5c97; --shadow:rgba(67,36,95,.28); --paper:#fffaf2;
  --pink:#ff5fa8; --purple:#9b5de5; --sun:#ffc93c; --mint:#19b8a6; --blue:#3f8efc;
  --font-display:"Fredoka","Rubik","Segoe UI",Arial,sans-serif;
  --font-text:"Rubik","Segoe UI",Arial,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --tile:clamp(72px,17vmin,168px);
  --btn:clamp(54px,9.5vmin,86px);
  --st:clamp(48px,12.5vmin,118px);
  --outline:.05em 0 0 var(--ink),-.05em 0 0 var(--ink),0 .05em 0 var(--ink),0 -.05em 0 var(--ink),
            .04em .04em 0 var(--ink),-.04em .04em 0 var(--ink),.04em -.04em 0 var(--ink),-.04em -.04em 0 var(--ink),
            0 .11em 0 var(--ink);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{touch-action:none}
body{
  margin:0;overflow:hidden;background:linear-gradient(var(--sky-top),var(--sky-low) 72%);
  color:var(--ink);font-family:var(--font-display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:none}
button:focus-visible{outline:5px solid var(--blue);outline-offset:4px}

/* ---------- רקע: שמיים, עננים וגבעה ---------- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.hill{position:absolute;left:-15%;right:-15%;bottom:-30vmin;height:48vmin;border-radius:50%;
  background:linear-gradient(var(--meadow),var(--meadow-deep))}
.cloud{position:absolute;width:22vmin;height:7vmin;border-radius:99px;background:#fff;opacity:.85;
  animation:drift 50s linear infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:9vmin;height:9vmin;left:3vmin;top:-4.5vmin}
.cloud::after{width:11vmin;height:11vmin;right:3vmin;top:-6vmin}
.cloud.a{top:9%;left:6%}
.cloud.b{top:24%;left:62%;scale:.7;animation-duration:70s}
.cloud.c{top:5%;left:38%;scale:.5;animation-duration:90s}
@keyframes drift{to{translate:14vw 0}}

/* ---------- מבנה ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  gap:clamp(6px,1.6vmin,16px);padding-block:clamp(8px,1.6vmin,16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bar{display:flex;align-items:center;gap:clamp(8px,2vmin,18px);min-height:var(--btn);flex:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  gap:clamp(8px,2vmin,20px)}

.rbtn{position:relative;flex:none;width:var(--btn);height:var(--btn);border-radius:50%;background:var(--paper);
  border:4px solid var(--ink);box-shadow:0 5px 0 var(--shadow);display:grid;place-items:center;
  font-family:var(--emoji);font-size:calc(var(--btn)*.5);line-height:1}
.pill{flex:none;height:var(--btn);padding:0 clamp(12px,2.6vmin,24px);border-radius:99px;background:var(--paper);
  border:4px solid var(--ink);box-shadow:0 5px 0 var(--shadow);display:flex;align-items:center;gap:.3em;
  font-size:calc(var(--btn)*.42);font-weight:700;font-variant-numeric:tabular-nums}
.pill .em{font-family:var(--emoji)}
#prog{flex:1;min-width:0;display:flex;justify-content:center;gap:clamp(3px,1.2vmin,12px);
  font-size:clamp(26px,6.4vmin,56px);line-height:1}
#prog i{font-style:normal;color:rgba(255,255,255,.75);text-shadow:var(--outline)}
#prog i.on{color:var(--sun);animation:pop .4s}
.parents{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;
  height:var(--btn);padding:0 14px;border-radius:99px;background:rgba(255,255,255,.6);border:3px dashed var(--ink-soft);
  font-family:var(--font-text);font-size:14px;font-weight:500;line-height:1.15;color:var(--ink)}
.parents small{font-size:11px;opacity:.8}
.parents::before{content:"";position:absolute;inset:0;background:var(--sun);transform:scaleX(0);transform-origin:right;z-index:-1}
.parents.hold::before{transform:scaleX(1);transition:transform 1.3s linear}

/* ---------- בועת ההוראה של הנסיכה ---------- */
.ask{position:relative;display:flex;align-items:center;gap:clamp(8px,2vmin,18px);max-width:100%;
  background:var(--paper);border:4px solid var(--ink);border-radius:clamp(24px,5vmin,46px);
  padding:clamp(6px,1.2vmin,12px) clamp(14px,3vmin,28px);box-shadow:0 5px 0 var(--shadow);
  font-size:clamp(20px,4.4vmin,40px);font-weight:600;line-height:1.15;text-align:start}
.ask .who{font-family:var(--emoji);font-size:1.5em;line-height:1}
.ask .say{min-width:0;text-wrap:balance}
.ask .chip{flex:none;min-width:1.7em;height:1.7em;border-radius:24%;background:var(--purple);color:#fff;
  display:grid;place-items:center;font-size:1.25em;font-weight:700}
.ear{font-family:var(--emoji);font-size:.85em;opacity:.85}
.ear::before{content:"🔊"}
body.speaking .ear::before{content:"⏹️"}
body.mute .ear{display:none}

/* ---------- שדה המשחק ומטרות גדולות ---------- */
.field{--gap:clamp(12px,3vmin,30px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:var(--gap);width:100%;max-width:calc(var(--tile)*5 + var(--gap)*4 + 4px)}
.field.duo{flex-wrap:nowrap;align-items:stretch;max-width:100%}
.tgt{position:relative;flex:none;width:var(--tile);height:var(--tile);border-radius:26%;background:var(--paper);
  border:4px solid var(--ink);box-shadow:0 6px 0 var(--shadow);display:grid;place-items:center;
  font-family:var(--emoji);font-size:calc(var(--tile)*.6);line-height:1}
.tgt.num{font-family:var(--font-display);font-weight:700;font-size:calc(var(--tile)*.7)}
.tgt.counted{background:#fff0a8}
/* שולי מגע רחבים: גם נגיעה קצת ליד הכפתור נספרת */
.tgt::after,.rbtn::after,.balloon::after,.card::after,.sw::after{content:"";position:absolute;inset:-10px}
.off{pointer-events:none}
.dim{opacity:.33;filter:grayscale(.7)}
.glow{animation:glow 1s ease-in-out infinite}
.badge{position:absolute;top:-12%;inset-inline-start:-12%;width:44%;height:44%;border-radius:50%;background:var(--pink);
  color:#fff;border:3px solid var(--ink);display:grid;place-items:center;
  font:700 calc(var(--tile)*.26)/1 var(--font-display);animation:pop .3s}
.tally{flex:none;height:calc(var(--tile)*.85);font-size:calc(var(--tile)*.85);font-weight:700;line-height:1;
  color:var(--pink);text-shadow:var(--outline)}

.balloon{position:relative;flex:none;width:var(--tile);height:calc(var(--tile)*1.18);
  margin-bottom:calc(var(--tile)*.12);border-radius:50% 50% 50% 50%/46% 46% 54% 54%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.6) 0 8%,transparent 9%),var(--c);
  border:4px solid var(--ink);box-shadow:0 6px 0 var(--shadow);display:grid;place-items:center;
  font:700 calc(var(--tile)*.62)/1 var(--font-display);color:#fff;text-shadow:var(--outline);
  animation:float 3.2s ease-in-out infinite}
.balloon::before{content:"";position:absolute;top:100%;left:50%;translate:-50% -35%;
  border:calc(var(--tile)*.07) solid transparent;border-bottom-color:var(--ink)}

.group{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(4px,1.4vmin,14px);
  max-width:min(100%,8.8em);padding:clamp(10px,2.4vmin,22px);border-radius:clamp(20px,4vmin,36px);
  background:rgba(255,255,255,.78);border:4px dashed var(--ink-soft);
  font-family:var(--emoji);font-size:clamp(30px,8.2vmin,78px);line-height:1}
.group.pick{position:relative;flex:1 1 0;min-width:0;max-width:6.4em;min-height:3.4em;background:var(--paper);
  border:4px solid var(--ink);box-shadow:0 6px 0 var(--shadow);font-size:clamp(26px,6.4vmin,60px)}

.card{position:relative;flex:none;width:var(--tile);height:calc(var(--tile)*1.22);perspective:700px}
.card .in{position:absolute;inset:0;transition:transform .35s;transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:18%;border:4px solid var(--ink);display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 var(--shadow);font-family:var(--emoji);line-height:1}
.card .b{background:repeating-linear-gradient(45deg,var(--purple) 0 14px,#b383f0 14px 28px);font-size:calc(var(--tile)*.42)}
.card .f{background:var(--paper);transform:rotateY(180deg);font-size:calc(var(--tile)*.62)}
.card.matched .f{background:#d5ffd9}

/* ---------- מסך הבית ----------*/
.home,.start{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vmin,22px)}
.hero{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,24px);max-width:100%}
.title{margin:0;font-size:clamp(28px,7vmin,70px);font-weight:700;line-height:1.1;color:#fff;text-shadow:var(--outline);
  text-align:center;text-wrap:balance}
.sub{font-size:clamp(16px,3.2vmin,28px);font-weight:600}
.mascot{flex:none;width:clamp(64px,17vmin,170px);aspect-ratio:1;position:relative}
.start .mascot{width:clamp(140px,38vmin,340px)}
.mascot svg,.pic{display:block;width:100%;height:100%}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.4vmin,26px);width:min(100%,106vmin)}
@media (orientation:portrait){.menu{grid-template-columns:repeat(2,1fr);width:min(100%,92vmin)}}
.mtile{position:relative;aspect-ratio:1.18;border-radius:clamp(20px,4vmin,40px);background:var(--c);
  border:4px solid var(--ink);box-shadow:0 7px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.15em;font-size:clamp(16px,3.5vmin,32px);font-weight:600;line-height:1.1}
.mtile .ic{font-family:var(--emoji);font-size:clamp(34px,9.5vmin,90px);line-height:1.1;display:flex;align-items:center;gap:.06em}
.mtile .ic.sm{font-size:clamp(22px,5.6vmin,54px)}
.mtile .ic svg{width:1em;height:1em}
.mtile .nb{font-family:var(--font-display);font-weight:700;color:#fff;text-shadow:var(--outline)}
.go{width:clamp(96px,24vmin,200px);aspect-ratio:1;border-radius:50%;background:var(--pink);border:5px solid var(--ink);
  box-shadow:0 8px 0 var(--shadow);display:grid;place-items:center;color:#fff;font-size:clamp(44px,11vmin,96px);
  animation:glow 1.2s ease-in-out infinite}
.note{font-family:var(--font-text);font-size:14px;line-height:1.5;max-width:60ch;text-align:center;
  background:rgba(255,255,255,.75);border-radius:14px;padding:8px 14px;margin:0}

/* ---------- צביעה ---------- */
.paint{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vmin,30px)}
.easel{flex:1 1 0;min-width:0;min-height:0;height:100%;max-width:100vmin;background:#fff;border:4px solid var(--ink);
  border-radius:clamp(18px,4vmin,36px);box-shadow:0 6px 0 var(--shadow);padding:clamp(4px,1.2vmin,12px)}
.palette{flex:none;display:grid;grid-template-columns:repeat(3,auto);gap:clamp(8px,1.8vmin,16px);justify-items:center;align-content:center}
.sw{position:relative;width:clamp(46px,10.5vmin,88px);aspect-ratio:1;border-radius:50%;background:var(--c);
  border:4px solid var(--ink);box-shadow:0 5px 0 var(--shadow)}
.sw.sel{scale:1.14;box-shadow:0 0 0 5px #fff,0 0 0 9px var(--ink)}
.sw.rb{background:conic-gradient(#f0434f,#ff8c2b,#ffd23f,#2fbf5f,#3f6cf0,#9b5de5,#ff7ac0,#f0434f)}
.palette .done{grid-column:1/-1}
@media (orientation:portrait){
  .paint{flex-direction:column}
  .easel{width:100%;height:auto;flex:1 1 0}
  .palette{grid-template-columns:repeat(6,auto)}
}
.r{fill:#fff;stroke:var(--ink);stroke-width:5;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;
  transform-box:fill-box;transform-origin:center}
.d{pointer-events:none}
.ln{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;pointer-events:none}
.pics .tgt{width:calc(var(--tile)*1.35);height:calc(var(--tile)*1.35);padding:6px;background:#fff}
.pics .r{pointer-events:none}

/* ---------- מתנה, מדבקות ואלבום ---------- */
.gift{position:relative;font-family:var(--emoji);font-size:clamp(110px,38vmin,300px);line-height:1.1;animation:jump 1s ease-in-out infinite}
.slot{position:relative;width:var(--st);height:var(--st);border-radius:50%;display:grid;place-items:center;
  font-family:var(--emoji);font-size:calc(var(--st)*.56);line-height:1}
.slot.got{background:#fff;border:4px solid #fff;box-shadow:0 0 0 3px var(--ink),0 6px 0 3px var(--shadow);rotate:var(--rot,0deg)}
.slot.no{border:4px dashed rgba(67,36,95,.45);color:rgba(67,36,95,.5);background:rgba(255,255,255,.45);
  font:700 calc(var(--st)*.45)/1 var(--font-display)}
.slot.new{animation:glow 1s ease-in-out infinite}
.slot.won{--st:clamp(140px,42vmin,330px);animation:pop .5s}
.wname{font-size:clamp(24px,5.5vmin,50px);font-weight:700}
.album{display:grid;grid-template-columns:repeat(6,var(--st));gap:clamp(10px,2.2vmin,22px);justify-content:center;
  max-height:100%;overflow-y:auto;touch-action:pan-y;padding:12px}
@media (orientation:portrait){.album{grid-template-columns:repeat(4,var(--st))}}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.6vmin,26px)}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:clamp(92px,21vmin,180px);
  padding:clamp(10px,2vmin,18px);border-radius:clamp(20px,4vmin,34px);background:var(--paper);border:4px solid var(--ink);
  box-shadow:0 6px 0 var(--shadow);font-size:clamp(16px,3.2vmin,28px);font-weight:600}
.act .ic{font-family:var(--emoji);font-size:clamp(36px,9vmin,76px);line-height:1}
.act.main{background:var(--sun)}
.act.done{flex-direction:row;min-width:0;padding:8px 14px;font-size:clamp(14px,2.8vmin,22px)}
.act.done .ic{font-size:1.6em}
.hand{position:fixed;z-index:5;translate:-50% 0;font-family:var(--emoji);font-size:clamp(40px,9vmin,84px);line-height:1;
  pointer-events:none;animation:poke .9s ease-in-out infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:30;pointer-events:none}

/* ---------- אזור ההורים ---------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(67,36,95,.62);display:grid;place-items:center;padding:16px;
  touch-action:pan-y}
.sheet{width:100%;max-width:640px;max-height:100%;overflow-y:auto;touch-action:pan-y;background:var(--paper);
  color:var(--ink);font-family:var(--font-text);font-size:16px;line-height:1.55;border-radius:24px;
  padding:clamp(16px,4vmin,28px);user-select:text;-webkit-user-select:text}
.sheet h2{font-family:var(--font-display);font-size:28px;margin:0 0 8px}
.sheet h3{font-family:var(--font-display);font-size:19px;margin:18px 0 6px}
.sheet p{margin:0 0 8px}
.sheet dl{margin:0;display:grid;gap:6px}
.sheet dt{font-weight:700}
.sheet dd{margin:0 0 4px}
.sheet label{display:block;font-weight:500;margin:12px 0 4px}
.sheet label.chk{display:flex;align-items:center;gap:10px}
.sheet input[type=text],.sheet select{width:100%;min-height:44px;font:inherit;color:inherit;background:#fff;
  border:2px solid var(--ink-soft);border-radius:12px;padding:6px 12px}
.sheet input[type=checkbox]{width:24px;height:24px;accent-color:var(--purple)}
.sheet .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.sheet button{touch-action:manipulation;min-height:44px;padding:8px 16px;border-radius:12px;border:2px solid var(--ink);
  background:#fff;font-weight:500}
.sheet button.primary{background:var(--purple);color:#fff;border-color:var(--purple);width:100%;margin-top:16px;font-weight:700}
.sheet button.danger{border-color:#c2293a;color:#c2293a}
.sheet .status{background:#f1e8fb;border-radius:12px;padding:10px 12px;margin-top:8px}

/* ---------- אנימציות ---------- */
@keyframes pop{0%{scale:.2}70%{scale:1.25}100%{scale:1}}
@keyframes press{0%{scale:1}40%{scale:.88}100%{scale:1}}
@keyframes wobble{0%,100%{rotate:0deg}20%{rotate:-9deg}40%{rotate:8deg}60%{rotate:-6deg}80%{rotate:4deg}}
@keyframes hop{0%,100%{translate:0 0}40%{translate:0 -16%}}
@keyframes jump{0%,100%{translate:0 0;rotate:-3deg}50%{translate:0 -6%;rotate:3deg}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6%}}
@keyframes glow{0%,100%{scale:1;filter:drop-shadow(0 0 0 #fff)}50%{scale:1.08;filter:drop-shadow(0 0 14px #fff)}}
@keyframes poke{0%,100%{transform:translateY(0)}50%{transform:translateY(-22%)}}
@keyframes fillpop{0%{scale:1}50%{scale:1.06}100%{scale:1}}
.press{animation:press .22s}
.wobble{animation:wobble .5s}
.hop{animation:hop .5s}
.fillpop{animation:fillpop .25s}
@media (prefers-reduced-motion:reduce){
  .cloud,.balloon,.gift,.go,.glow,.slot.new{animation:none}
  .card .in{transition:none}
}
</style>

</head>
<body>
<div class="sky" aria-hidden="true"><div class="cloud a"></div><div class="cloud b"></div><div class="cloud c"></div><div class="hill"></div></div>
<div id="app" dir="rtl" lang="he">
  <header id="bar" hidden></header>
  <main id="stage"></main>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script>
(() => {
'use strict';
document.documentElement.lang = 'he';

/* =====================================================================
   עזרים כלליים
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'style') n.style.cssText = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
  return n;
}
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, k) => shuffle(a).slice(0, k);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const last = {};
// בוחר פריט אקראי שאינו זה שנבחר בפעם הקודמת, כדי שלא תחזור אותה שאלה פעמיים ברצף
function pickNew(key, arr) { const o = arr.filter(x => x !== last[key]); const v = pick(o.length ? o : arr); last[key] = v; return v; }
function anim(n, cls) {
  n.classList.remove(cls); n.getBoundingClientRect(); n.classList.add(cls);

let lastTick = 0;
// התנועה מחושבת לפי זמן אמיתי, כך שגם במחשב איטי הקונפטי נעלם אחרי כשנייה וחצי

    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.beginPath();

/* =====================================================================
   מסגרת המשחק: סרגל עליון, מעבר בין מסכים, שאלות, כוכבים

const bar = $('#bar'), stage = $('#stage');

let round = null, lastGame = 'count', qMiss = 0, progEl = null, starEl = null, started = false;

}
function addStar(n = 1) { S.stars += n; save(); starEl.querySelector('b').textContent = S.stars; anim(starEl, 'press'); }
function askBubble(text, chip) {

// בונה מסך שאלה: בועת הוראה (שמוקראת בקול) ושדה ריק למטרות
function scene(text, chip) {

}
function startGame(id) {

  round = { id, done: 0, miss: 0, total: id === 'memory' ? [2, 3, 4][S.levels.memory - 1] : 5 };

function nextQ() {

async function correct(node, text) {

// טעות: בלי עונש. האפשרות השגויה נעלמת, המשחק אומר מה היא, ואחרי שתי טעויות התשובה הנכונה מהבהבת.

// בסוף סיבוב: הרמה עולה כשכמעט אין טעויות ויורדת כשיש הרבה, ואז מגיעה המתנה

/* =====================================================================
   המשחקים
   ===================================================================== */
const GAMES = {
  // ספירה: נוגעים בכל פריט, והמשחק סופר יחד עם הילדה. אין כאן תשובה שגויה.
  count() {
    const max = maxN('count'), lo = max <= 3 ? 1 : max <= 5 ? 2 : 3;
    const n = pickNew('countN', range(lo, max)), it = pickNew('item', ITEMS), g = gen;
    const field = scene(`בואי נספור! געי בכל ${it.one}`);
    const tally = el('div', { class: 'tally', 'aria-live': 'polite' });
    stage.append(tally);
    let c = 0; const nodes = [];
    for (let i = 0; i < n; i++) {
      const b = el('button', { class: 'tgt', 'aria-label': it.one, text: it.e });
      onTap(b, async () => {
        if (b.classList.contains('counted')) return;
        removeHand(); if (!S.hinted) { S.hinted = true; save(); }
        c++; b.classList.add('counted', 'off'); b.append(el('span', { class: 'badge', text: c }));
        anim(b, 'hop'); sfx.count(c); Voice.say(NUM_F[c], { minor: true });
        tally.textContent = c; anim(tally, 'press');
        if (c < n) return;
        frozen = true; clearIdle();
        await wait(900); if (g !== gen) return;
        correct(tally, `${phrase(n, it)}! ${praise()}`);
      });
      nodes.push(b); field.append(b);
    }
    const hint = () => { const left = nodes.find(x => !x.classList.contains('counted')); if (left) showHand(left); };
    if (!S.hinted) setTimeout(() => { if (g === gen && c === 0) hint(); }, 600);
    setIdle(() => { Voice.say(`געי בכל ${it.one}`); hint(); });
  },

  // זיהוי מספרים: מוצאים את הבלון עם המספר שהנסיכה אומרת
  numbers() {
    const max = maxN('numbers'), k = Math.min(max >= 10 ? 4 : 3, max);
    const opts = sample(range(1, max), k), t = pickNew('num', opts);
    const silent = Voice.mode !== 'browser' && Voice.mode !== 'tts';
    // ברמה הראשונה (או בלי הקראה) המספר מוצג גם בבועה, וכך זה תרגיל התאמה
    const field = scene(`איפה המספר ${NUM_F[t]}?`, silent || max <= 3 ? t : null);
    const cols = shuffle(NUM_BALLOONS);
    choices(field, opts, (v, i) => el('button', { class: 'balloon', style: `--c:${cols[i]};animation-delay:${-i * .8}s`, text: v }),
      v => v === t, v => `נכון! זה המספר ${NUM_F[v]}`, v => `זה ${NUM_F[v]}. איפה ${NUM_F[t]}?`);
  },

  // כמויות: פעם "כמה יש?" (כמות מול ספרה) ופעם "איפה יש יותר?" (השוואה)
  amounts() {
    const max = maxN('amounts'), it = pickNew('item', ITEMS);
    const dots = (n, node) => { for (let i = 0; i < n; i++) node.append(el('span', { text: it.e })); return node; };
    if (round.done % 2 === 0) {
      const n = pickNew('amtN', range(1, max));
      const field = scene(`כמה ${it.many} יש?`);
      field.before(dots(n, el('div', { class: 'group', role: 'img', 'aria-label': phrase(n, it) })));
      const set = new Set([n]); while (set.size < Math.min(3, max)) set.add(clamp(n + rnd(-2, 2), 1, max));

        v => v === n, () => `נכון! ${phrase(n, it)}`, v => `זה ${NUM_F[v]}. בואי נספור שוב`);
    } else {
      const minD = max > 3 ? 2 : 1; let a, b;
      do { a = rnd(1, max); b = rnd(1, max); } while (Math.abs(a - b) < minD);
      const less = max >= 10 && Math.random() < .3, want = less ? Math.min(a, b) : Math.max(a, b);
      const field = scene(less ? `איפה יש פחות ${it.many}?` : `איפה יש יותר ${it.many}?`);
      field.classList.add('duo');
      choices(field, [a, b], v => dots(v, el('button', { class: 'group pick', 'aria-label': phrase(v, it) })),
        v => v === want, () => less ? 'נכון! כאן יש פחות' : 'נכון! כאן יש יותר',
        () => less ? 'כאן יש יותר. איפה יש פחות?' : 'כאן יש פחות. איפה יש יותר?');
    }
  },

  // צבעים וצורות, לסירוגין
  looks() {
    const lv = S.levels.looks;

      const opts = sample(lv === 1 ? COLORS.slice(0, 4) : COLORS, lv === 3 ? 4 : 3), t = pickNew('col', opts);
      const field = scene(`איפה הבלון ה${t.name}?`);
      choices(field, opts, (c, i) => el('button', { class: 'balloon', 'aria-label': c.name, style: `--c:${c.hex};animation-delay:${-i * .8}s` }),
        c => c === t, c => `נכון! זה ${c.name}`, c => `זה ${c.name}. איפה ה${t.name}?`);
    } else {
      const opts = sample(SHAPES.slice(0, lv === 1 ? 3 : lv === 2 ? 5 : 7), lv === 3 ? 4 : 3), t = pickNew('shape', opts);
      const cols = shuffle(COLORS);
      const field = scene(`איפה ה${t.name}?`);
      choices(field, opts, (s, i) => el('button', { class: 'tgt', 'aria-label': s.name, html: shapeSvg(s, cols[i].hex) }),
        s => s === t, s => `נכון! זה ${s.name}`, s => `זה ${s.name}. איפה ה${t.name}?`);
    }
  },

  // זיכרון: הופכים קלפים ומוצאים זוגות. מספר הזוגות גדל עם הרמה (2, 3, 4).

    let open = [], busy = false;

      const c = el('button', { class: 'card', 'aria-label': 'קלף' }, el('span', { class: 'in' }, el('span', { class: 'b', text: '⭐' }), el('span', { class: 'f', text: f.e })));
      onTap(c, async () => {
        if (busy || c.classList.contains('up')) return;

        open.push({ c, f }); if (open.length < 2) return;

          round.done++; renderProg(); addStar(); sfx.good(); burstAt(y.c, 22); Voice.say(praise());

        } else {

/* ---------- צביעה: בוחרים ציור, בוחרים צבע, ונוגעים בחלק כדי למלא אותו ---------- */

  stage.replaceChildren(el('div', { class: 'start' }, mascot(), el('h1', { class: 'title', text: kingdom() }),
    el('div', { class: 'go', role: 'button', tabindex: '0', 'aria-label': 'התחילי לשחק', text: '▶' }), el('div', { class: 'sub', text: 'געי כדי להתחיל' }), note,
    S.name ? null : el('p', { class: 'note', text: 'להורים: כדי שהמשחק יפנה לילדה בשמה, כתבו את השם בכפתור "להורים" במסך הבית. השם נשמר רק בדפדפן הזה.' })));
  voiceUI();
  // מתחילים בשחרור האצבע (pointerup), כי רק אז הדפדפן מרשה להשמיע קול
  const begin = () => {
    if (started) return; started = true;
    audio(); sfx.fanfare(); party(); keepAwake();
    go(home); Voice.say(hi('במה נשחק היום?'));
  };
  document.addEventListener('pointerup', begin, { once: true });
  document.addEventListener('keydown', e => { if (!started && (e.key === 'Enter' || e.key === ' ')) begin(); });
}
function keepAwake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* לא חובה */ } }
document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') keepAwake(); });

/* =====================================================================
   אזור ההורים (נפתח בלחיצה ארוכה, כדי שהילדה לא תיכנס אליו בטעות)
   ===================================================================== */
function parentsButton() {
  const pb = el('button', { class: 'parents', type: 'button' }, el('span', { text: 'להורים' }), el('small', { text: 'לחיצה ארוכה' }));
  let t = 0;
  const stop = () => { clearTimeout(t); pb.classList.remove('hold'); };
  pb.addEventListener('pointerdown', () => { pb.classList.add('hold'); t = setTimeout(() => { stop(); openParents(); }, 1300); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => pb.addEventListener(n, stop));
  pb.addEventListener('keydown', e => { if (e.key === 'Enter') openParents(); });
  return pb;
}
function openParents() {
  if ($('.overlay')) return;
  clearIdle(); Voice.stop();
  const ov = el('div', { class: 'overlay free', dir: 'rtl', lang: 'he' });
  const sh = el('div', { class: 'sheet', role: 'dialog', 'aria-label': 'להורים' });
  sh.innerHTML = `
    <h2>להורים</h2>
    <p>משחק לימודי לגילאי 3 עד 4. הכול עובד בנגיעה אחת, בלי גרירה, וההוראות מוקראות בקול. נגיעה בבועה של הנסיכה משמיעה את ההוראה שוב.</p>
    <h3>המשחקים ומה מתרגלים בהם</h3>
    <dl>
      <dt>סופרים</dt><dd>ספירה בקול והתאמה של מספר לכל פריט: נוגעים בכל פריט, והמשחק סופר יחד עם הילדה.</dd>
      <dt>מספרים</dt><dd>זיהוי ספרות: מוצאים את הבלון עם המספר שנאמר.</dd>
      <dt>כמה יש?</dt><dd>כמויות: התאמת כמות לספרה, והשוואה בין יותר לפחות.</dd>
      <dt>צבעים וצורות</dt><dd>שמות הצבעים והצורות הבסיסיות.</dd>
      <dt>זיכרון</dt><dd>זיכרון חזותי וריכוז, עם 2 עד 4 זוגות קלפים.</dd>
      <dt>צביעה</dt><dd>מוטוריקה עדינה, בחירת צבעים ויצירה חופשית.</dd>
    </dl>
    <h3>פרסים וקושי</h3>
    <p>כל תשובה נכונה מזכה בכוכב. בסוף כל סיבוב מחכה מתנה, ובתוכה מדבקה חדשה לאלבום (24 מדבקות). טעות לא מורידה כלום: האפשרות השגויה נעלמת, ואחרי שתי טעויות התשובה הנכונה מהבהבת. הקושי עולה לבד כשהסיבוב עובר כמעט בלי טעויות.</p>
    <h3>הגדרות</h3>
    <label for="p-name">שם הילדה</label><input type="text" id="p-name" maxlength="14">
    <label for="p-range">טווח המספרים</label>
    <select id="p-range"><option value="0">אוטומטי: מתחיל ב-3 ועולה עד 10</option><option value="3">עד 3</option><option value="5">עד 5</option><option value="10">עד 10</option></select>
    <label class="chk" for="p-sfx"><input type="checkbox" id="p-sfx"> צלילים</label>
    <label class="chk" for="p-speech"><input type="checkbox" id="p-speech"> הקראה בקול</label>
    <p class="status" id="p-voice"></p>
    <div class="row">
      <button type="button" id="p-test">בדיקת הקראה</button>
      <button type="button" id="p-full">מסך מלא</button>
      <button type="button" id="p-reset" class="danger">איפוס כוכבים ומדבקות</button>
    </div>
    <p>ההתקדמות נשמרת בדפדפן של המחשב הזה בלבד.</p>
    <button type="button" id="p-close" class="primary">חזרה למשחק</button>`;
  ov.append(sh); document.body.append(ov);
  const name = $('#p-name'), rng = $('#p-range'), sf = $('#p-sfx'), sp = $('#p-speech');
  name.value = S.name; rng.value = String(S.range); sf.checked = S.sfx; sp.checked = S.speech;
  $('#p-voice').textContent = voiceStatus();
  name.addEventListener('input', () => { S.name = name.value.trim() || DEFAULTS.name; save(); });
  rng.addEventListener('change', () => { S.range = Number(rng.value); save(); });
  sf.addEventListener('change', () => { S.sfx = sf.checked; save(); });
  sp.addEventListener('change', () => { S.speech = sp.checked; save(); voiceUI(); });
  $('#p-test').addEventListener('click', () => { audio(); sfx.good(); Voice.say(hi('בואי נספור: אחת, שתיים, שלוש')); });
  $('#p-full').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) { /* לא בכל דפדפן יש מסך מלא */ }
  });
  const reset = $('#p-reset'); let armed = false;
  reset.addEventListener('click', () => {
    if (!armed) { armed = true; reset.textContent = 'בטוח? לחיצה נוספת מוחקת את הכול'; return; }
    S.stars = 0; S.stickers = []; S.newest = ''; S.hinted = false; S.levels = Object.assign({}, DEFAULTS.levels); save();
    armed = false; reset.textContent = 'נמחק. מתחילים מחדש';
  });
  $('#p-close').addEventListener('click', () => { ov.remove(); go(home); });
}

/* =====================================================================
   הפעלה
   ===================================================================== */
Voice.init();
startScreen();
})();
</script>
</body>
</html>
