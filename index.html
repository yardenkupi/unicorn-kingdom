<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="משחק לימודי במגע לגילאי 3-4: ספירה, מספרים, כמויות, צבעים, צורות, זיכרון וצביעה.">
<meta name="theme-color" content="#7cc8ff">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>ממלכת חד הקרן</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen touch app over a layered storybook scene (dusk sky, rainbow,
   hills, castle). Soft "clay" surfaces: gradients, inner light and diffuse coloured
   shadows instead of outlines. One bright world by choice, so no dark variant. */
:root{
  --ink:#3a2a66; --ink-soft:#7c6aa8; --line:#4a3a7a;
  --pink:#ff6fae; --lilac:#a98bf5; --violet:#7c5ce0; --sky:#6cc3ff; --mint:#5fd9b5; --sun:#ffc94d;
  --glass:rgba(255,255,255,.38);
  --clay:inset 0 2px 0 rgba(255,255,255,.95),inset 0 -8px 14px rgba(124,92,224,.10),
         0 14px 24px -8px rgba(72,44,140,.34),0 3px 6px rgba(72,44,140,.12);
  --font-display:"Fredoka","Rubik","Segoe UI",Arial,sans-serif;
  --font-text:"Rubik","Segoe UI",Arial,sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --tile:clamp(72px,17vmin,168px);
  --btn:clamp(54px,9.5vmin,86px);
  --st:clamp(48px,12.5vmin,118px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{touch-action:none}
body{
  margin:0;overflow:hidden;background:linear-gradient(#79b6ff,#b7b0ff 42%,#ffc6e2 72%,#ffe8c4);
  color:var(--ink);font-family:var(--font-display);
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:none}
button:focus-visible{outline:4px solid #fff;outline-offset:4px}

/* ---------- רקע: סצנה מצוירת בשכבות ---------- */
.defs{position:absolute;width:0;height:0;overflow:hidden}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cl{animation:drift var(--d,80s) ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(90px)}}
.tw{fill:#fff;transform-box:fill-box;transform-origin:center;animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15;scale:.6}50%{opacity:1;scale:1}}

/* ---------- מבנה ---------- */
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  gap:clamp(6px,1.6vmin,16px);padding-block:clamp(8px,1.6vmin,16px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bar{display:flex;align-items:center;gap:clamp(8px,2vmin,18px);min-height:var(--btn);flex:none}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;
  gap:clamp(8px,2vmin,20px)}

.ico{width:54%;height:54%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:currentColor;stroke:none}
.star{display:block;width:1em;height:1em}
.rbtn{position:relative;flex:none;width:var(--btn);height:var(--btn);border-radius:50%;
  background:linear-gradient(#fff,#f3ecff);box-shadow:var(--clay);color:var(--violet);display:grid;place-items:center}
.pill{flex:none;height:var(--btn);padding:0 clamp(12px,2.6vmin,24px);border-radius:99px;
  background:linear-gradient(#fff,#f3ecff);box-shadow:var(--clay);display:flex;align-items:center;gap:.3em;
  font-size:calc(var(--btn)*.42);font-weight:700;font-variant-numeric:tabular-nums}
.pill .star{font-size:1.15em;filter:drop-shadow(0 2px 2px rgba(200,130,0,.35))}
#prog{flex:1;min-width:0;display:flex;justify-content:center;gap:clamp(3px,1.2vmin,12px);
  font-size:clamp(26px,6.2vmin,54px);line-height:1}
#prog i{display:block;filter:drop-shadow(0 3px 4px rgba(72,44,140,.25))}
#prog i:not(.on) path{fill:rgba(255,255,255,.5);stroke:rgba(255,255,255,.85)}
#prog i.on{animation:pop .45s cubic-bezier(.34,1.56,.64,1)}
.parents{flex:none;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;
  height:calc(var(--btn)*.8);padding:0 16px;border-radius:99px;background:var(--glass);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.7);
  font-family:var(--font-text);font-size:13px;font-weight:500;line-height:1.15;color:var(--ink);text-align:start}
.parents .ico{width:18px;height:18px;flex:none}
.parents small{display:block;font-size:11px;opacity:.75}
.parents::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.75);transform:scaleX(0);transform-origin:right;z-index:-1}
.parents.hold::before{transform:scaleX(1);transition:transform 1.3s linear}

/* ---------- בועת ההוראה של הנסיכה ---------- */
.ask{position:relative;display:flex;align-items:center;gap:clamp(8px,2vmin,18px);max-width:100%;
  padding:clamp(5px,1vmin,10px);padding-inline-end:clamp(14px,3vmin,28px);border-radius:clamp(30px,7vmin,70px);
  background:linear-gradient(#fff,#f7f1ff);box-shadow:var(--clay);
  font-size:clamp(19px,4.2vmin,38px);font-weight:600;line-height:1.15;text-align:start}
.ask .who{flex:none;width:1.9em;height:1.9em;border-radius:50%;overflow:hidden;
  background:linear-gradient(160deg,#eee4ff,#c9b4fb);box-shadow:inset 0 -3px 6px rgba(72,44,140,.2)}
.ask .say{min-width:0;text-wrap:balance}
.ask .chip{flex:none;min-width:1.7em;height:1.7em;border-radius:28%;color:#fff;display:grid;place-items:center;
  font-size:1.2em;font-weight:700;background:linear-gradient(160deg,#b79cff,#7c5ce0);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 6px 10px -4px rgba(124,92,224,.7)}
.ear{flex:none;width:1.35em;height:1.35em;border-radius:50%;background:#efe7ff;color:var(--violet);display:grid;place-items:center}
.ear .ico{width:62%;height:62%}
.ear .i-stop,body.speaking .ear .i-snd{display:none}
body.speaking .ear .i-stop{display:block}
body.mute .ear{display:none}

/* ---------- לוח המשחק (זכוכית חלבית) ומטרות גדולות ---------- */
.board{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2.2vmin,22px);max-width:100%;
  padding:clamp(14px,3.6vmin,38px);border-radius:clamp(26px,5.5vmin,52px);background:var(--glass);
  -webkit-backdrop-filter:blur(14px) saturate(1.25);backdrop-filter:blur(14px) saturate(1.25);
  border:1.5px solid rgba(255,255,255,.75);
  box-shadow:0 24px 50px -18px rgba(72,44,140,.38),inset 0 1px 0 rgba(255,255,255,.8)}
.field{--gap:clamp(12px,3vmin,30px);display:flex;flex-wrap:wrap;justify-content:center;align-items:center;
  gap:var(--gap);max-width:calc(var(--tile)*5 + var(--gap)*4 + 4px)}
.field.duo{flex-wrap:nowrap;align-items:stretch;max-width:100%}
.tgt{position:relative;flex:none;width:var(--tile);height:var(--tile);border-radius:28%;
  background:linear-gradient(#fff,#f4eeff);box-shadow:var(--clay);display:grid;place-items:center;
  font-family:var(--emoji);font-size:calc(var(--tile)*.58);line-height:1}
.tgt.num{font-family:var(--font-display);font-weight:700;font-size:calc(var(--tile)*.68);color:var(--violet)}
.tgt.counted{background:linear-gradient(#fff7d1,#ffe08a);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.9),0 14px 24px -8px rgba(230,160,20,.55),0 3px 6px rgba(72,44,140,.12)}
/* שולי מגע רחבים: גם נגיעה קצת ליד הכפתור נספרת */
.tgt::after,.rbtn::after,.balloon::after,.card::after,.sw::after{content:"";position:absolute;inset:-10px}
.off{pointer-events:none}
.dim{opacity:.3;filter:grayscale(.7)}
.glow{animation:glow 1s ease-in-out infinite}
.badge{position:absolute;top:-12%;inset-inline-start:-12%;width:44%;height:44%;border-radius:50%;color:#fff;
  background:linear-gradient(160deg,#ff9cc8,#ff5fa2);box-shadow:0 0 0 3px #fff,0 6px 10px -2px rgba(255,80,150,.6);
  display:grid;place-items:center;font:700 calc(var(--tile)*.25)/1 var(--font-display);
  animation:pop .35s cubic-bezier(.34,1.56,.64,1)}
.tally{flex:none;height:calc(var(--tile)*.8);font-size:calc(var(--tile)*.8);font-weight:700;line-height:1;color:#fff;
  text-shadow:0 3px 0 rgba(255,95,162,.9),0 10px 22px rgba(255,80,150,.55)}

.balloon{position:relative;flex:none;width:var(--tile);height:calc(var(--tile)*1.32);
  filter:drop-shadow(0 12px 10px rgba(72,44,140,.28));animation:float 3.4s ease-in-out infinite}
.balloon svg{display:block;width:100%;height:100%}
.balloon span{position:absolute;inset:0 0 26% 0;display:grid;place-items:center;color:#fff;
  font:700 calc(var(--tile)*.56)/1 var(--font-display);text-shadow:0 3px 0 rgba(40,20,90,.22)}

.group{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:clamp(4px,1.4vmin,14px);
  max-width:min(100%,8.8em);padding:clamp(10px,2.4vmin,22px);border-radius:clamp(20px,4vmin,36px);
  background:rgba(255,255,255,.62);box-shadow:inset 0 3px 10px rgba(72,44,140,.14),inset 0 -1px 0 rgba(255,255,255,.9);
  font-family:var(--emoji);font-size:clamp(30px,8.2vmin,78px);line-height:1}
.group.pick{position:relative;width:min(40vw,6.4em);max-width:none;min-height:3.4em;
  background:linear-gradient(#fff,#f4eeff);box-shadow:var(--clay);font-size:clamp(26px,6.4vmin,60px)}

.card{position:relative;flex:none;width:var(--tile);height:calc(var(--tile)*1.22);perspective:700px}
.card .in{position:absolute;inset:0;transition:transform .4s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card.up .in{transform:rotateY(180deg)}
.card .f,.card .b{position:absolute;inset:0;border-radius:20%;display:grid;place-items:center;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--clay);font-family:var(--emoji);line-height:1}
.card .b{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 45%),linear-gradient(160deg,#b79cff,#ff8fc4);
  font-size:calc(var(--tile)*.44);color:#fff}
.card .b .star path{fill:#fff;stroke:#fff}
.card .f{background:linear-gradient(#fff,#f4eeff);transform:rotateY(180deg);font-size:calc(var(--tile)*.6)}
.card.matched .f{background:linear-gradient(#f3fff0,#c8f5cf)}

/* ---------- מסך הבית ---------- */
.title{margin:0;font-size:clamp(28px,6.6vmin,66px);font-weight:700;line-height:1.08;color:#fff;text-align:center;text-wrap:balance;
  text-shadow:0 2px 0 rgba(124,92,224,.55),0 4px 0 rgba(124,92,224,.25),0 14px 30px rgba(72,44,140,.4)}
.sub{font-size:clamp(15px,3vmin,26px);font-weight:600;color:#fff;text-shadow:0 2px 8px rgba(72,44,140,.45)}
.mascot{position:relative;flex:none;aspect-ratio:400/420}
.mascot::before{content:"";position:absolute;left:14%;right:14%;bottom:-2%;height:9%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(60,30,120,.3),transparent)}
.mascot .pic{position:relative;animation:bob 4s ease-in-out infinite}
.pic{display:block;width:100%;height:100%;overflow:visible}
.home{flex:1;min-height:0;width:100%;display:grid;grid-template-columns:minmax(0,34fr) minmax(0,66fr);
  align-items:center;justify-items:center;gap:clamp(10px,3vmin,40px)}
.hero{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,1.6vmin,16px);min-width:0;max-width:100%}
.hero .mascot{width:min(100%,44vmin)}
.menu{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,2.4vmin,26px);width:100%;max-width:118vmin}
.mtile{position:relative;aspect-ratio:1.05;border-radius:clamp(22px,4.4vmin,44px);overflow:hidden;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -12px 22px rgba(60,30,120,.10),0 18px 28px -10px var(--cs),0 3px 6px rgba(72,44,140,.12);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5%;
  font-size:clamp(15px,3.1vmin,28px);font-weight:600;line-height:1.1}
.mtile::before{content:"";position:absolute;inset:0 0 52% 0;background:linear-gradient(rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.mtile svg{position:relative;width:66%;height:auto;overflow:visible;filter:drop-shadow(0 6px 7px rgba(60,30,120,.25))}
.mtile span{position:relative;background:rgba(255,255,255,.8);padding:.18em .85em;border-radius:99px;
  box-shadow:0 4px 8px -4px rgba(60,30,120,.35)}
@media (orientation:portrait){
  .home{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:center}
  .hero{flex-direction:row}
  .hero .mascot{width:clamp(72px,24vmin,150px)}
  .menu{grid-template-columns:repeat(2,1fr);max-width:92vmin;align-self:start}
}
.start{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(8px,2vmin,20px)}
.start .mascot{width:clamp(130px,36vmin,330px)}
.go{position:relative;width:clamp(92px,21vmin,180px);aspect-ratio:1;border-radius:50%;color:#fff;display:grid;place-items:center;
  background:linear-gradient(160deg,#ff9cc8,#ff5fa2);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.6),inset 0 -10px 18px rgba(170,20,90,.25),0 18px 30px -8px rgba(255,80,150,.65);
  animation:pulse 1.6s ease-in-out infinite}
.go .ico{width:50%;height:50%;translate:6% 0}
.note{font-family:var(--font-text);font-size:14px;line-height:1.5;max-width:60ch;text-align:center;color:var(--ink);
  background:rgba(255,255,255,.72);border-radius:14px;padding:8px 14px;margin:0}

/* ---------- צביעה ---------- */
.paint{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vmin,30px)}
.easel{flex:1 1 0;min-width:0;min-height:0;height:100%;max-width:100vmin;background:#fff;
  border-radius:clamp(20px,4.4vmin,40px);padding:clamp(6px,1.6vmin,16px);
  box-shadow:0 24px 44px -16px rgba(72,44,140,.45),0 3px 8px rgba(72,44,140,.12),inset 0 0 0 6px #faf6ff}
.palette{flex:none;display:grid;grid-template-columns:repeat(3,auto);gap:clamp(8px,1.8vmin,16px);justify-items:center;align-content:center;
  padding:clamp(8px,2vmin,18px);border-radius:clamp(20px,4vmin,36px);background:var(--glass);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid rgba(255,255,255,.75)}
.sw{position:relative;width:clamp(44px,10vmin,84px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8) 0 6%,rgba(255,255,255,0) 22%),
             radial-gradient(circle at 50% 115%,rgba(40,20,90,.3),rgba(40,20,90,0) 62%),var(--c);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 10px 14px -6px rgba(72,44,140,.5);transition:scale .15s}
.sw.sel{scale:1.14;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--violet),0 10px 14px -4px rgba(72,44,140,.5)}
.sw.rb{background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.8) 0 6%,rgba(255,255,255,0) 22%),
  conic-gradient(#f0475c,#ff9a3d,#ffd84a,#3ecb7a,#4a78f0,#9a78f0,#ff7fb5,#f0475c)}
.palette .done{grid-column:1/-1}
@media (orientation:portrait){
  .paint{flex-direction:column}
  .easel{width:100%;height:auto;flex:1 1 0}
  .palette{grid-template-columns:repeat(6,auto)}
}
.r{fill:#fff;stroke:var(--line);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round;cursor:pointer;
  transform-box:fill-box;transform-origin:center;transition:fill .18s}
.ln{fill:none;stroke:var(--line);stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.fl{fill:#ff8fc0;stroke:var(--line);stroke-width:4;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.d{pointer-events:none}
.a{display:none;pointer-events:none}
/* אותו ציור במצב "מאויר": מילוי בגרדיאנטים רכים, בלי קווי מתאר כהים */
.art .a{display:inline}
.art .r{stroke:rgba(126,96,204,.3);stroke-width:1.5;pointer-events:none;transition:none}
.art .ln{stroke-width:3.5;stroke:#5a4590}
.art .fl{stroke:rgba(126,96,204,.3);stroke-width:1.5}
.art{filter:drop-shadow(0 8px 10px rgba(72,44,140,.22))}
.pics .tgt{width:calc(var(--tile)*1.35);height:calc(var(--tile)*1.35);padding:8px}
.pics .r{pointer-events:none;stroke-width:6}

/* ---------- מתנה, מדבקות ואלבום ---------- */
.gift{position:relative;width:clamp(140px,40vmin,320px);aspect-ratio:1;animation:jump 1.1s ease-in-out infinite}
.gift svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 14px rgba(72,44,140,.3))}
.gift .lid{transform-box:fill-box;transform-origin:50% 100%}
.prize{position:relative;display:grid;place-items:center}
.rays{position:absolute;width:190%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:repeating-conic-gradient(rgba(255,255,255,.6) 0 10deg,rgba(255,255,255,0) 10deg 30deg);
  -webkit-mask:radial-gradient(circle,#000 18%,transparent 66%);mask:radial-gradient(circle,#000 18%,transparent 66%);
  animation:spin 16s linear infinite}
.slot{position:relative;width:var(--st);height:var(--st);border-radius:50%;display:grid;place-items:center;
  font-family:var(--emoji);font-size:calc(var(--st)*.56);line-height:1}
.slot.got{background:radial-gradient(circle at 30% 22%,#fff 0 30%,#f3ecff 100%);rotate:var(--rot,0deg);
  box-shadow:0 0 0 4px #fff,0 14px 20px -8px rgba(72,44,140,.5),0 3px 6px rgba(72,44,140,.15)}
.slot.no{background:rgba(255,255,255,.35);box-shadow:inset 0 3px 8px rgba(72,44,140,.18);color:rgba(58,42,102,.4);
  font:700 calc(var(--st)*.42)/1 var(--font-display)}
.slot.new{animation:glow 1s ease-in-out infinite}
.slot.won{--st:clamp(130px,38vmin,300px);animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
.wname{font-size:clamp(24px,5.5vmin,50px);font-weight:700;color:#fff;text-shadow:0 2px 0 rgba(124,92,224,.55),0 10px 22px rgba(72,44,140,.4)}
.album{display:grid;grid-template-columns:repeat(6,var(--st));gap:clamp(10px,2.2vmin,22px);justify-content:center;
  max-height:100%;overflow-y:auto;touch-action:pan-y;padding:6px}
.board.wide{min-height:0}
@media (orientation:portrait){.album{grid-template-columns:repeat(4,var(--st))}}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(10px,2.6vmin,26px)}
.act{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:clamp(92px,21vmin,180px);
  padding:clamp(10px,2vmin,18px);border-radius:clamp(22px,4.4vmin,38px);background:linear-gradient(#fff,#f4eeff);
  box-shadow:var(--clay);font-size:clamp(15px,3vmin,26px);font-weight:600}
.act .ic{width:clamp(40px,10vmin,80px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(160deg,#b79cff,#7c5ce0);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 8px 12px -6px rgba(124,92,224,.8)}
.act.main .ic{background:linear-gradient(160deg,#ff9cc8,#ff5fa2);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 8px 12px -6px rgba(255,80,150,.8)}
.act.done{flex-direction:row;min-width:0;padding:8px 16px 8px 10px;font-size:clamp(14px,2.8vmin,22px)}
.act.done .ic{width:clamp(30px,6.5vmin,48px);background:linear-gradient(160deg,#8fe9c0,#2fc48d);box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.hand{position:fixed;z-index:5;translate:-50% 0;font-family:var(--emoji);font-size:clamp(40px,9vmin,84px);line-height:1;
  pointer-events:none;filter:drop-shadow(0 6px 6px rgba(72,44,140,.35));animation:poke .9s ease-in-out infinite}

.sheet button.danger{border-color:#f3b6c0;color:#c2293a}

/* =====================================================================
   הקראה בעברית.
   1. קול עברי של הדפדפן (למשל ב-Edge) – מהיר וללא הגבלה.
   2. אם אין, ההקראה של Claude (כשהדף נפתח ב-claude.ai והיא תומכת בעברית).
   3. אם אין אף אחד – המשחק ממשיך עם טקסט, אנימציות ורמזים.
   ===================================================================== */
const Voice = {
  he: null, tts: null, ttsState: 'idle', keep: null,
  init() {
    if ('speechSynthesis' in window) {
      const pickVoice = () => {
        const vs = speechSynthesis.getVoices().filter(v => /^(he|iw)/i.test(v.lang));
        const score = v => (/natural|online/i.test(v.name) ? 2 : 0) + (/hila/i.test(v.name) ? 1 : 0);
        vs.sort((a, b) => score(b) - score(a));
        this.he = vs[0] || null; voiceUI();
      };
      pickVoice();
      if (speechSynthesis.addEventListener) speechSynthesis.addEventListener('voiceschanged', pickVoice);
    }
    const use = window.claude && window.claude.use;
    if (use) window.claude.use('tts').then(async t => {
      if (!t) return;
      let langs; try { langs = t.languages ? await t.languages() : undefined; } catch (e) { langs = undefined; }
      if (!langs || !langs.some(l => /^he/i.test(l))) return;
      this.tts = t;
      t.onState(e => {
        this.ttsState = e.state;
        if (e.reason === 'not_granted' || e.reason === 'unavailable') this.tts = null;
        voiceUI();
      });
      voiceUI();
    }).catch(() => {});
  },
  get mode() { return !S.speech ? 'off' : this.he ? 'browser' : this.tts ? 'tts' : 'none'; },
  speaking() { return this.mode === 'tts' && this.ttsState !== 'idle'; },
  stop() {
    try { if (this.mode === 'browser') speechSynthesis.cancel(); else if (this.tts) this.tts.stop().catch(() => {}); } catch (e) { /* אין מה לעצור */ }
  },
  // minor = מילים קצרות (ספירה, שם של קלף). בהקראה של Claude מדלגים עליהן כדי לא לחרוג מהקצב המותר.
  say(text, o = {}) {
    const mode = this.mode;
    if (mode === 'browser') return new Promise(res => {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.voice = this.he; u.lang = this.he.lang; u.rate = .92; u.pitch = 1.12;
        let done = false; const fin = () => { if (!done) { done = true; res(); } };
        u.onend = fin; u.onerror = fin; setTimeout(fin, 1500 + text.length * 130);
        this.keep = u; speechSynthesis.speak(u);
      } catch (e) { res(); }
    });
    if (mode === 'tts') {
      if (o.minor) return Promise.resolve();
      return this.tts.speak(text, { language: 'he', rate: .95 }).then(() => {}, err => {
        if (err && (err.code === 'not_granted' || err.code === 'unavailable')) { this.tts = null; voiceUI(); }
      });
    }
    return Promise.resolve();
  },
};
function voiceUI() {
  const m = Voice.mode;
  document.body.classList.toggle('mute', m === 'none' || m === 'off');
  document.body.classList.toggle('speaking', Voice.speaking());
  const st = $('#p-voice'); if (st) st.textContent = voiceStatus();
  const sn = $('#voiceNote'); if (sn) sn.hidden = m !== 'none';
}
function voiceStatus() {
  const m = Voice.mode;
  if (m === 'off') return 'ההקראה כבויה.';
  if (m === 'browser') return `ההקראה פעילה בקול העברי של הדפדפן (${Voice.he.name}).`;
  if (m === 'tts') return 'ההקראה פעילה בקול של Claude.';
  return 'לא נמצא קול עברי בדפדפן הזה, ולכן ההוראות מוצגות בלי הקראה. כדי לשמוע אותן: פתחו את המשחק ב-Microsoft Edge, או התקינו ב-Windows את חבילת הדיבור בעברית (הגדרות ← זמן ושפה ← דיבור) ופתחו מחדש.';
}
// מחכה לסוף המשפט, אבל לא יותר מ-max אלפיות שנייה, כדי שהמשחק לא ייתקע
const sayWait = (text, max) => Promise.all([Promise.race([Voice.say(text), wait(max)]), wait(900)]);

/* =====================================================================
   מגע שמתאים לילדה בת 3:
   - מגיבים מיד בנגיעה (pointerdown), לא בשחרור. לחיצה ארוכה או אצבע שזזה עדיין נחשבות.
   - נגיעה קצת ליד הכפתור נספרת לכפתור הקרוב.
   - נגיעות כפולות ומהירות מדי מסוננות, והדפדפן לא מגלול, לא מגדיל ולא פותח תפריט.
   ===================================================================== */
const taps = new WeakMap();

function fire(node, e) {
  const now = performance.now(), fn = taps.get(node);

  if (node.classList.contains('off')) return;
  if (frozen && stage.contains(node)) return;

document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;

  e.preventDefault();
  idleKick();
  let node = e.target.closest && e.target.closest('[data-tap]');
  if (!node && !(e.target.closest && e.target.closest('button'))) {
    let best = null, bd = 1e9;
    const reach = Math.max(28, Math.min(innerWidth, innerHeight) * .05);
    document.querySelectorAll('[data-tap]:not(.off)').forEach(n => {
      const r = n.getBoundingClientRect(); if (!r.width) return;
      const dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right), dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
      const d = Math.hypot(dx, dy); if (d < bd) { bd = d; best = n; }

  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 2.5 + Math.random() * 6.5;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: 5 + Math.random() * 8, c: pick(CONF), life: 55 + Math.random() * 30, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, star: Math.random() < .6 });

// התנועה מחושבת לפי זמן אמיתי, כך שגם במחשב איטי הקונפטי נעלם אחרי כשנייה וחצי

/* =====================================================================
   מסגרת המשחק: סרגל עליון, מעבר בין מסכים, שאלות, כוכבים
   ===================================================================== */
const bar = $('#bar'), stage = $('#stage');
let gen = 0;            // מספר המסך הנוכחי: פעולה מושהית שנולדה במסך קודם מבטלת את עצמה
let round = null, lastGame = 'count', qMiss = 0, progEl = null, starEl = null, started = false;

function go(fn) { gen++; clearIdle(); removeHand(); frozen = false; fn(); enter([...stage.children]); }
function renderBar(mode) {

  if (mode === 'home') bar.append(onTap(el('button', { class: 'rbtn', 'aria-label': 'האלבום שלי', html: ico('album') }), () => { sfx.pop(); go(album); }));
  else bar.append(onTap(el('button', { class: 'rbtn', 'aria-label': 'הביתה', html: ico('home') }), () => { sfx.pop(); Voice.stop(); go(home); }));
  progEl = el('div', { id: 'prog', 'aria-hidden': 'true' });
  starEl = el('div', { class: 'pill', 'aria-label': 'כוכבים', html: STAR }, el('b', { text: S.stars }));
  bar.append(progEl, starEl);
  if (mode === 'home') bar.append(parentsButton());
}
function renderProg() {
  progEl.replaceChildren(...(round ? range(1, round.total).map(i => el('i', { class: i <= round.done ? 'on' : '', html: STAR })) : []));
}
// כוכב שעף מהתשובה הנכונה אל מונה הכוכבים
function flyStar(from) {

  const a = from.getBoundingClientRect(), b = starEl.getBoundingClientRect();

  const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + b.width * .3, y1 = b.top + b.height / 2;

    { duration: 800, easing: 'cubic-bezier(.5,0,.3,1)' }).finished.then(done, done);

function addStar(n = 1, from) {

}
function askBubble(text, chip) {

}
// בונה מסך שאלה: בועת הוראה (שמוקראת בקול) ולוח עם שדה ריק למטרות
function scene(text, chip) {

function startGame(id) {

function nextQ() {

async function correct(node, text) {

// טעות: בלי עונש. האפשרות השגויה נעלמת, המשחק אומר מה היא, ואחרי שתי טעויות התשובה הנכונה מהבהבת.

// בסוף סיבוב: הרמה עולה כשכמעט אין טעויות ויורדת כשיש הרבה, ואז מגיעה המתנה

/* =====================================================================
   המשחקים
   ===================================================================== */
const GAMES = {
  // ספירה: נוגעים בכל פריט, והמשחק סופר יחד עם הילדה. אין כאן תשובה שגויה.
  count() {
    const max = maxN('count'), lo = max <= 3 ? 1 : max <= 5 ? 2 : 3;
    const n = pickNew('countN', range(lo, max)), it = pickNew('item', ITEMS), g = gen;
    const field = scene(`בואי נספור! געי בכל ${it.one}`);
    const tally = el('div', { class: 'tally', 'aria-live': 'polite' });
    field.after(tally);
    let c = 0; const nodes = [];
    for (let i = 0; i < n; i++) {
      const b = el('button', { class: 'tgt', 'aria-label': it.one, text: it.e });
      onTap(b, async () => {
        if (b.classList.contains('counted')) return;
        removeHand(); if (!S.hinted) { S.hinted = true; save(); }
        c++; b.classList.add('counted', 'off'); b.append(el('span', { class: 'badge', text: c }));
        anim(b, 'hop'); sfx.count(c); Voice.say(NUM_F[c], { minor: true });
        tally.textContent = c; anim(tally, 'press');
        if (c < n) return;
        frozen = true; clearIdle();
        await wait(900); if (g !== gen) return;
        correct(tally, `${phrase(n, it)}! ${praise()}`);
      });
      nodes.push(b); field.append(b);
    }
    const hint = () => { const left = nodes.find(x => !x.classList.contains('counted')); if (left) showHand(left); };
    if (!S.hinted) setTimeout(() => { if (g === gen && c === 0) hint(); }, 900);
    setIdle(() => { Voice.say(`געי בכל ${it.one}`); hint(); });
  },

  // זיהוי מספרים: מוצאים את הבלון עם המספר שהנסיכה אומרת
  numbers() {
    const max = maxN('numbers'), k = Math.min(max >= 10 ? 4 : 3, max);
    const opts = sample(range(1, max), k), t = pickNew('num', opts);
    const silent = Voice.mode !== 'browser' && Voice.mode !== 'tts';
    // ברמה הראשונה (או בלי הקראה) המספר מוצג גם בבועה, וכך זה תרגיל התאמה
    const field = scene(`איפה המספר ${NUM_F[t]}?`, silent || max <= 3 ? t : null);
    const cols = shuffle(NUM_BALLOONS);
    choices(field, opts, (v, i) => balloon(cols[i], v, i),
      v => v === t, v => `נכון! זה המספר ${NUM_F[v]}`, v => `זה ${NUM_F[v]}. איפה ${NUM_F[t]}?`);
  },

  // כמויות: פעם "כמה יש?" (כמות מול ספרה) ופעם "איפה יש יותר?" (השוואה)
  amounts() {
    const max = maxN('amounts'), it = pickNew('item', ITEMS);
    const dots = (n, node) => { for (let i = 0; i < n; i++) node.append(el('span', { text: it.e })); return node; };
    if (round.done % 2 === 0) {
      const n = pickNew('amtN', range(1, max));
      const field = scene(`כמה ${it.many} יש?`);
      field.before(dots(n, el('div', { class: 'group', role: 'img', 'aria-label': phrase(n, it) })));
      const set = new Set([n]); while (set.size < Math.min(3, max)) set.add(clamp(n + rnd(-2, 2), 1, max));
      choices(field, shuffle([...set]), v => el('button', { class: 'tgt num', text: v }),
        v => v === n, () => `נכון! ${phrase(n, it)}`, v => `זה ${NUM_F[v]}. בואי נספור שוב`);
    } else {

        v => v === want, () => less ? 'נכון! כאן יש פחות' : 'נכון! כאן יש יותר',
        () => less ? 'כאן יש יותר. איפה יש פחות?' : 'כאן יש פחות. איפה יש יותר?');
    }

      const field = scene(`איפה הבלון ה${t.name}?`);

        s => s === t, s => `נכון! זה ${s.name}`, s => `זה ${s.name}. איפה ה${t.name}?`);
    }
  },

  // זיכרון: הופכים קלפים ומוצאים זוגות. מספר הזוגות גדל עם הרמה (2, 3, 4).
  memory() {

    const faces = sample(STICKERS, pairs), deck = shuffle([...faces, ...faces]);
    const field = scene('מצאי שני קלפים זהים');

        } else {

};

/* ---------- צביעה: בוחרים ציור, בוחרים צבע, ונוגעים בחלק כדי למלא אותו ---------- */
function paintPick() {
  const field = scene('איזה ציור נצבע?');
  field.classList.add('pics');
  PICS.forEach(p => field.append(onTap(el('button', { class: 'tgt', 'aria-label': p.name, html: svgOf(p) }), () => { sfx.pop(); go(() => paint(p)); })));
}
function paint(p) {
  const g = gen; frozen = false;

  const easel = el('div', { class: 'easel', html: svgOf(p) });
  const pal = el('div', { class: 'palette' });
  const regs = [...easel.querySelectorAll('.r')];
  const finish = async () => {
    if (finished) return; finished = true; frozen = true; clearIdle();
    addStar(3, easel); sfx.fanfare(); party(); anim(easel, 'hop');
    await sayWait('איזה ציור יפה! כל הכבוד', 3200); if (g !== gen) return;
    await wait(900); if (g !== gen) return;
    go(gift);
  };
  const done = onTap(el('button', { class: 'act main done', hidden: '' }, el('span', { class: 'ic', html: ico('check') }), el('span', { text: 'סיימתי' })), finish);
  regs.forEach(r => onTap(r, () => {
    const hex = color.rainbow ? pick(PAINTS.filter(x => !x.rainbow)).hex : color.hex;
    if (!r.dataset.c) { r.dataset.c = '1'; filled++; }
    r.style.fill = hex; sfx.pop(); anim(r, 'fill');
    if (filled >= Math.ceil(regs.length / 2)) done.hidden = false;
    if (filled === regs.length) setTimeout(() => { if (g === gen) finish(); }, 1200);
  }));
  PAINTS.forEach((c, i) => {
    const sw = el('button', { class: 'sw' + (c.rainbow ? ' rb' : '') + (i === 0 ? ' sel' : ''), 'aria-label': c.name, style: c.rainbow ? '' : `--c:${c.hex}` });
    onTap(sw, () => { color = c; pal.querySelectorAll('.sw').forEach(x => x.classList.remove('sel')); sw.classList.add('sel'); sfx.pop(); Voice.say(c.name, { minor: true }); });
    pal.append(sw);
  });
  pal.append(done);
  const text = 'בחרי צבע וגעי בציור';
  stage.replaceChildren(askBubble(text), el('div', { class: 'paint' }, easel, pal));
  Voice.say(text);
  setIdle(() => Voice.say(text));
}

/* =====================================================================
   פרסים: מתנה בסוף כל סיבוב, ובתוכה מדבקה חדשה לאלבום
   ===================================================================== */
function act(icon, label, fn, main) {
  return onTap(el('button', { class: 'act' + (main ? ' main' : '') }, el('span', { class: 'ic', html: ico(icon), 'aria-hidden': 'true' }), el('span', { text: label })), () => { sfx.pop(); fn(); });
}
function gift() {
  renderBar('game'); round = null; renderProg();
  const g = gen;
  const head = el('h2', { class: 'title', text: toYou('קיבלת מתנה!') });
  const box = el('button', { class: 'gift', 'aria-label': 'מתנה, געי כדי לפתוח', html: GIFT });
  stage.replaceChildren(head, box);
  sfx.sparkle(); Voice.say(toYou('קיבלת מתנה! געי בה'));
  setIdle(() => { Voice.say('געי במתנה'); showHand(box); });
  onTap(box, async () => {
    clearIdle(); removeHand(); box.classList.add('off');
    const left = STICKERS.filter(s => !S.stickers.includes(s.e));
    let won;
    if (left.length) { won = pick(left); S.stickers.push(won.e); S.newest = won.e; }
    else { won = { e: '🏆', name: 'גביע' }; S.stars += 5; }
    save(); starEl.querySelector('b').textContent = S.stars;
    sfx.fanfare();
    // המכסה עף, ואז המדבקה קופצת החוצה על רקע קרני אור
    const lid = box.querySelector('.lid');
    if (lid && lid.animate && !reduced) lid.animate([{ translate: '0 0', rotate: '0deg', opacity: 1 }, { translate: '0 -90%', rotate: '24deg', opacity: 0 }], { duration: 520, easing: 'ease-out', fill: 'forwards' });
    await wait(reduced ? 0 : 420); if (g !== gen) return;
    party();
    head.textContent = left.length ? 'מדבקה חדשה!' : 'אספת את כל המדבקות!';
    const prize = el('div', { class: 'prize' }, el('div', { class: 'rays' }), el('div', { class: 'slot got won', text: won.e }));
    box.replaceWith(prize); prize.after(el('div', { class: 'wname', text: won.name }));
    Voice.say(left.length ? `זכית במדבקה חדשה: ${won.name}!` : 'אספת את כל המדבקות! כל הכבוד!');
    await wait(1500); if (g !== gen) return;
    const acts = el('div', { class: 'acts' },
      act('replay', 'עוד פעם', () => go(() => startGame(lastGame)), true),
      act('album', 'האלבום שלי', () => go(album)),
      act('home', 'הביתה', () => go(home)));
    stage.append(acts); enter([...acts.children]);
  });
}
function album() {
  renderBar('game'); round = null; renderProg();
  const n = S.stickers.length, grid = el('div', { class: 'album' });
  STICKERS.forEach((s, i) => {
    const got = S.stickers.includes(s.e);
    const slot = el(got ? 'button' : 'div', { class: 'slot ' + (got ? 'got' : 'no') + (got && s.e === S.newest ? ' new' : ''),
      style: `--rot:${(i * 37 % 13) - 6}deg`, 'aria-label': got ? s.name : 'מדבקה שעוד לא נאספה', text: got ? s.e : '?' });
    if (got) onTap(slot, () => { anim(slot, 'hop'); sfx.pop(); burstAt(slot, 8); Voice.say(s.name); });
    grid.append(slot);
  });
  stage.replaceChildren(el('h2', { class: 'title', text: S.name ? `האלבום של ${S.name}` : 'האלבום שלי' }),
    el('div', { class: 'sub', text: `${n} מתוך ${STICKERS.length} מדבקות` }), el('div', { class: 'board wide' }, grid));
  Voice.say(n === 0 ? 'האלבום עוד ריק. שחקי כדי לזכות במדבקות' : n === 1 ? 'יש לך מדבקה אחת' : `יש לך ${n} מדבקות`);
}

/* =====================================================================
   מסך הבית ומסך הפתיחה
   ===================================================================== */
const tileSvg = body => `<svg viewBox="0 0 120 90" aria-hidden="true">${body}</svg>`;
const star5 = (x, y, R, r) => `<polygon points="${starPts(x, y, R, r)}" fill="url(#gSun)" stroke="#ffb93a" stroke-width="3" stroke-linejoin="round"/>`;
const MENU = [
  { id: 'count', name: 'סופרים', c: ['#ffd6e8', '#ffa5cc', 'rgba(255,111,174,.55)'],
    ic: star5(22, 52, 19, 8.5) + star5(60, 40, 24, 10.5) + star5(98, 52, 19, 8.5) + T(22, 58, 15, '#8a5200', 1) + T(60, 47, 19, '#8a5200', 2) + T(98, 58, 15, '#8a5200', 3) },
  { id: 'numbers', name: 'מספרים', c: ['#e6dbff', '#b9a0fa', 'rgba(124,92,224,.55)'],
    ic: `<path d="M36 64 q-5 8 1 16 M78 68 q6 8 -1 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="36" cy="42" rx="19" ry="22" fill="url(#gPink)"/><ellipse cx="29" cy="33" rx="5" ry="8" transform="rotate(-25 29 33)" fill="#fff" opacity=".5"/>${T(36, 50, 22, '#fff', 1)}
      <ellipse cx="78" cy="38" rx="27" ry="31" fill="url(#gSun)"/><ellipse cx="67" cy="24" rx="7" ry="11" transform="rotate(-25 67 24)" fill="#fff" opacity=".55"/>${T(78, 50, 32, '#fff', 3)}` },
  { id: 'amounts', name: 'כמה יש?', c: ['#fff4bd', '#ffd670', 'rgba(240,170,40,.55)'],
    ic: `<rect x="8" y="16" width="58" height="58" rx="17" fill="#fff"/><circle cx="26" cy="34" r="7.5" fill="url(#gPink)"/><circle cx="48" cy="34" r="7.5" fill="url(#gPink)"/><circle cx="37" cy="56" r="7.5" fill="url(#gPink)"/>
      <circle cx="93" cy="45" r="23" fill="url(#gLilac)"/>${T(93, 55, 29, '#fff', 3)}` },
  { id: 'looks', name: 'צבעים וצורות', c: ['#d2f7e2', '#8be0b9', 'rgba(60,180,140,.55)'],
    ic: `<rect x="60" y="8" width="46" height="46" rx="11" fill="url(#gSky)"/><circle cx="36" cy="50" r="26" fill="url(#gPink)"/>
      <polygon points="56,82 102,82 79,44" fill="url(#gSun)" stroke="#ffc94d" stroke-width="7" stroke-linejoin="round"/><ellipse cx="26" cy="38" rx="7" ry="4.5" transform="rotate(-30 26 38)" fill="#fff" opacity=".5"/>` },
  { id: 'memory', name: 'זיכרון', c: ['#d3ecff', '#93cbfa', 'rgba(70,150,230,.55)'],
    ic: `<g transform="rotate(-12 42 46)"><rect x="18" y="12" width="48" height="66" rx="11" fill="url(#gLilac)"/><polygon points="${starPts(42, 46, 14, 6.2)}" fill="#fff"/></g>
      <g transform="rotate(10 82 48)"><rect x="58" y="14" width="48" height="66" rx="11" fill="#fff"/><path d="M82 62 C62 46 69 28 82 39 C95 28 102 46 82 62 Z" fill="url(#gPink)"/></g>` },
  { id: 'paint', name: 'צביעה', c: ['#ffe3d0', '#ffb58c', 'rgba(240,130,80,.55)'],
    ic: `<path d="M60 10 C92 8 114 26 112 50 C110 70 94 66 86 60 C76 54 70 62 74 72 C78 84 60 86 42 82 C18 76 6 58 10 40 C14 22 34 12 60 10 Z" fill="url(#gPeach)"/>
      <circle cx="32" cy="40" r="10" fill="url(#gPink)"/><circle cx="54" cy="26" r="10" fill="url(#gSun)"/><circle cx="80" cy="26" r="10" fill="url(#gMint)"/><circle cx="96" cy="44" r="8.5" fill="url(#gSky)"/><circle cx="40" cy="62" r="9" fill="url(#gLilac)"/>` },
];
function home() {
  round = null; renderBar('home'); renderProg();
  const m = mascot();
  onTap(m, () => { anim(m, 'hop'); sfx.sparkle(); burstAt(m, 14); Voice.say('אני חד קרן! בואי נשחק'); });
  const menu = el('div', { class: 'menu' });
  MENU.forEach(t => menu.append(onTap(el('button', { class: 'mtile', style: `--c1:${t.c[0]};--c2:${t.c[1]};--cs:${t.c[2]}`, html: tileSvg(t.ic) + `<span>${t.name}</span>` }), () => { sfx.pop(); go(() => startGame(t.id)); })));
  stage.replaceChildren(el('div', { class: 'home' }, el('div', { class: 'hero' }, el('h1', { class: 'title', text: kingdom() }), m), menu));
  queueMicrotask(() => enter([...menu.children]));
  setIdle(() => Voice.say('במה נשחק? געי בתמונה'));
}
function startScreen() {
  bar.hidden = true;
  const note = el('p', { class: 'note', id: 'voiceNote', hidden: '', text: 'להורים: לא נמצא קול עברי בדפדפן הזה, ולכן ההוראות יוצגו בלי הקראה. פרטים בכפתור "להורים" במסך הבית.' });
  stage.replaceChildren(el('div', { class: 'start' }, mascot(), el('h1', { class: 'title', text: kingdom() }),
    el('div', { class: 'go', role: 'button', tabindex: '0', 'aria-label': 'התחילי לשחק', html: ico('play') }), el('div', { class: 'sub', text: 'געי כדי להתחיל' }), note,
    S.name ? null : el('p', { class: 'note', text: 'להורים: כדי שהמשחק יפנה לילדה בשמה, כתבו את השם בכפתור "להורים" במסך הבית. השם נשמר רק בדפדפן הזה.' })));
  voiceUI();
  // מתחילים בשחרור האצבע (pointerup), כי רק אז הדפדפן מרשה להשמיע קול
  const begin = () => {
    if (started) return; started = true;
    audio(); sfx.fanfare(); party(); keepAwake();
    go(home); Voice.say(hi('במה נשחק היום?'));
  };
  document.addEventListener('pointerup', begin, { once: true });
  document.addEventListener('keydown', e => { if (!started && (e.key === 'Enter' || e.key === ' ')) begin(); });
}
function keepAwake() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {}); } catch (e) { /* לא חובה */ } }
document.addEventListener('visibilitychange', () => { if (started && document.visibilityState === 'visible') keepAwake(); });

/* =====================================================================
   אזור ההורים (נפתח בלחיצה ארוכה, כדי שהילדה לא תיכנס אליו בטעות)
   ===================================================================== */
function parentsButton() {
  const pb = el('button', { class: 'parents', type: 'button', html: ico('lock') + '<span>להורים<small>לחיצה ארוכה</small></span>' });
  let t = 0;
  const stop = () => { clearTimeout(t); pb.classList.remove('hold'); };
  pb.addEventListener('pointerdown', () => { pb.classList.add('hold'); t = setTimeout(() => { stop(); openParents(); }, 1300); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(n => pb.addEventListener(n, stop));
  pb.addEventListener('keydown', e => { if (e.key === 'Enter') openParents(); });
  return pb;
}
function openParents() {
  if ($('.overlay')) return;
  clearIdle(); Voice.stop();
  const ov = el('div', { class: 'overlay free', dir: 'rtl', lang: 'he' });
  const sh = el('div', { class: 'sheet', role: 'dialog', 'aria-label': 'להורים' });
  sh.innerHTML = `
    <h2>להורים</h2>
    <p>משחק לימודי לגילאי 3 עד 4. הכול עובד בנגיעה אחת, בלי גרירה, וההוראות מוקראות בקול. נגיעה בבועה של הנסיכה משמיעה את ההוראה שוב.</p>
    <h3>המשחקים ומה מתרגלים בהם</h3>
    <dl>
      <dt>סופרים</dt><dd>ספירה בקול והתאמה של מספר לכל פריט: נוגעים בכל פריט, והמשחק סופר יחד עם הילדה.</dd>
      <dt>מספרים</dt><dd>זיהוי ספרות: מוצאים את הבלון עם המספר שנאמר.</dd>
      <dt>כמה יש?</dt><dd>כמויות: התאמת כמות לספרה, והשוואה בין יותר לפחות.</dd>
      <dt>צבעים וצורות</dt><dd>שמות הצבעים והצורות הבסיסיות.</dd>
      <dt>זיכרון</dt><dd>זיכרון חזותי וריכוז, עם 2 עד 4 זוגות קלפים.</dd>
      <dt>צביעה</dt><dd>מוטוריקה עדינה, בחירת צבעים ויצירה חופשית.</dd>
    </dl>
    <h3>פרסים וקושי</h3>
    <p>כל תשובה נכונה מזכה בכוכב. בסוף כל סיבוב מחכה מתנה, ובתוכה מדבקה חדשה לאלבום (24 מדבקות). טעות לא מורידה כלום: האפשרות השגויה נעלמת, ואחרי שתי טעויות התשובה הנכונה מהבהבת. הקושי עולה לבד כשהסיבוב עובר כמעט בלי טעויות.</p>
    <h3>הגדרות</h3>
    <label for="p-name">שם הילדה</label><input type="text" id="p-name" maxlength="14">
    <label for="p-range">טווח המספרים</label>
    <select id="p-range"><option value="0">אוטומטי: מתחיל ב-3 ועולה עד 10</option><option value="3">עד 3</option><option value="5">עד 5</option><option value="10">עד 10</option></select>
    <label class="chk" for="p-sfx"><input type="checkbox" id="p-sfx"> צלילים</label>
    <label class="chk" for="p-speech"><input type="checkbox" id="p-speech"> הקראה בקול</label>
    <p class="status" id="p-voice"></p>
    <div class="row">
      <button type="button" id="p-test">בדיקת הקראה</button>
      <button type="button" id="p-full">מסך מלא</button>
      <button type="button" id="p-reset" class="danger">איפוס כוכבים ומדבקות</button>
    </div>
    <p>ההתקדמות נשמרת בדפדפן של המחשב הזה בלבד.</p>
    <button type="button" id="p-close" class="primary">חזרה למשחק</button>`;
  ov.append(sh); document.body.append(ov);
  const name = $('#p-name'), rng = $('#p-range'), sf = $('#p-sfx'), sp = $('#p-speech');
  name.value = S.name; rng.value = String(S.range); sf.checked = S.sfx; sp.checked = S.speech;
  $('#p-voice').textContent = voiceStatus();
  name.addEventListener('input', () => { S.name = name.value.trim() || DEFAULTS.name; save(); });
  rng.addEventListener('change', () => { S.range = Number(rng.value); save(); });
  sf.addEventListener('change', () => { S.sfx = sf.checked; save(); });
  sp.addEventListener('change', () => { S.speech = sp.checked; save(); voiceUI(); });
  $('#p-test').addEventListener('click', () => { audio(); sfx.good(); Voice.say(hi('בואי נספור: אחת, שתיים, שלוש')); });
  $('#p-full').addEventListener('click', () => {
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
    } catch (e) { /* לא בכל דפדפן יש מסך מלא */ }
  });
  const reset = $('#p-reset'); let armed = false;
  reset.addEventListener('click', () => {
    if (!armed) { armed = true; reset.textContent = 'בטוח? לחיצה נוספת מוחקת את הכול'; return; }
    S.stars = 0; S.stickers = []; S.newest = ''; S.hinted = false; S.levels = Object.assign({}, DEFAULTS.levels); save();
    armed = false; reset.textContent = 'נמחק. מתחילים מחדש';
  });
  $('#p-close').addEventListener('click', () => { ov.remove(); go(home); });
}

/* =====================================================================
   הפעלה
   ===================================================================== */
Voice.init();
startScreen();
})();
</script>
